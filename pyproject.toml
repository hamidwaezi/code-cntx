[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-cntx"
version = "0.1.0"
description = "Local-first repository context orchestration for AI coding models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
